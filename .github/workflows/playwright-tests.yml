name: Playwright tests

# Independent quality pipeline. It does not deploy VBConnection and it is not a
# required check of the application repository.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        type: choice
        required: true
        default: mocked
        options:
          - mocked
          - live-readonly
      suite:
        description: Playwright suite
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - regression
          - structural
      target:
        description: Frontend target
        type: choice
        required: true
        default: newfront
        options:
          - newfront
          - hmg
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'mocked' }}
  cancel-in-progress: true

env:
  CI: true
  PLAYWRIGHT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'mocked' }}
  SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'regression' }}
  PLAYWRIGHT_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'newfront' }}
  PLAYWRIGHT_NEWFRONT_URL: https://newfront.vbconnection.info
  PLAYWRIGHT_GATE0_LIVE: '0'
  PLAYWRIGHT_GATE1_LIVE: '0'
  PLAYWRIGHT_GATE2_LIVE: '0'
  PLAYWRIGHT_GATE3_LIVE: '0'
  PLAYWRIGHT_PAGE02_STRUCTURAL_LIVE: '0'

jobs:
  mocked:
    name: Mocked
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'live-readonly')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate matriz fixtures and assert determinism
        run: |
          npm run matriz:generate
          if [ -n "$(git status --porcelain -- fixtures/matriz)" ]; then
            git --no-pager diff -- fixtures/matriz || true
            echo "::error::matriz:generate changed versioned fixtures (not deterministic)."
            exit 1
          fi

      - name: Compare mock × Java matriz
        run: npm run matriz:compare

      - name: Unit tests
        run: npm run test:unit

      - name: Validate suite selection
        id: select
        run: node scripts/ci-select.mjs

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run mocked Playwright suite
        id: e2e
        run: npx playwright test ${{ steps.select.outputs.args }}

      - name: Summarize results
        if: always()
        env:
          PROBE_OUTCOME: success
          E2E_OUTCOME: ${{ steps.e2e.outcome || 'skipped' }}
          GIT_SHA: ${{ github.sha }}
          APP_VERSION: ${{ github.ref_name }}
          DEPLOY_ID: independent-qe
        run: node scripts/summarize-e2e-results.mjs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-mocked-${{ env.SUITE }}
          path: |
            playwright-report/**
            test-results/e2e-results.json
            test-results/e2e-junit.xml
            test-results/e2e-summary.md
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the workflow when the suite fails
        if: always()
        shell: bash
        run: |
          echo "e2e=${{ steps.e2e.outcome || 'skipped' }}"
          if [ "${{ steps.e2e.outcome }}" != "success" ]; then
            echo "::error::Mocked Playwright did not finish successfully. See the summary and the uploaded report."
            exit 1
          fi

  live-readonly:
    name: Live readonly
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live-readonly'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: live-readonly
    env:
      PLAYWRIGHT_MASTER_USER: ${{ secrets.PLAYWRIGHT_MASTER_USER }}
      PLAYWRIGHT_MASTER_PASSWORD: ${{ secrets.PLAYWRIGHT_MASTER_PASSWORD }}
      PLAYWRIGHT_MASTER_PERFIL: MASTER
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate suite selection
        id: select
        run: node scripts/ci-select.mjs

      - name: Enable live-readonly flags
        shell: bash
        run: |
          if [ "${SUITE}" = "regression" ]; then
            echo "PLAYWRIGHT_GATE0_LIVE=1" >> "$GITHUB_ENV"
            echo "PLAYWRIGHT_GATE1_LIVE=1" >> "$GITHUB_ENV"
            echo "PLAYWRIGHT_GATE2_LIVE=1" >> "$GITHUB_ENV"
            echo "PLAYWRIGHT_GATE3_LIVE=1" >> "$GITHUB_ENV"
          fi
          echo "PLAYWRIGHT_PAGE02_STRUCTURAL_LIVE=1" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run live-readonly Playwright suite
        id: e2e
        run: npx playwright test ${{ steps.select.outputs.args }}

      - name: Summarize results
        if: always()
        env:
          PROBE_OUTCOME: success
          E2E_OUTCOME: ${{ steps.e2e.outcome || 'skipped' }}
          GIT_SHA: ${{ github.sha }}
          APP_VERSION: ${{ github.ref_name }}
          DEPLOY_ID: independent-qe
        run: node scripts/summarize-e2e-results.mjs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-live-readonly-${{ env.SUITE }}
          path: |
            playwright-report/**
            test-results/e2e-results.json
            test-results/e2e-junit.xml
            test-results/e2e-summary.md
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the workflow when the suite fails
        if: always()
        shell: bash
        run: |
          echo "e2e=${{ steps.e2e.outcome || 'skipped' }}"
          if [ "${{ steps.e2e.outcome }}" != "success" ]; then
            echo "::error::Live-readonly Playwright did not finish successfully. See the summary and the uploaded report."
            exit 1
          fi
